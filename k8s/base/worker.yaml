apiVersion: apps/v1
kind: Deployment
metadata:
  name: gavel-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gavel-worker
  template:
    metadata:
      labels:
        app: gavel-worker
    spec:
      serviceAccountName: gavel-sa
      containers:
        - name: worker
          image: gavel-backend:latest
          command: ["node", "dist/worker.js"]
          envFrom:
            - configMapRef:
                name: gavel-backend-config
            - secretRef:
                name: gavel-backend-secrets
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
